# pnpm 11 and later fail the install on dependency build scripts that are not
# listed here. pnpm 10 blocked these two scripts silently, so they stay denied:
# the install behaves as it did before the upgrade.
allowBuilds:
  esbuild: false
  unrs-resolver: false

# Temporary: react and react-dom 19.3.1 (published 2026-10-14T16:46Z) are
# younger than pnpm's default one-day minimumReleaseAge, which fails every
# frozen install. Remove this list once that release is a day old.
minimumReleaseAgeExclude:
  - react@19.3.1
  - react-dom@19.3.1
