[package]
name = "ferroni"
version = "2.1.1"
edition = "2024"
description = "Oniguruma's regex engine in pure Rust: full Oniguruma syntax, a vscode-oniguruma-compatible TextMate scanner, no C toolchain"
license = "BSD-2-Clause"
authors = ["Sebastian Software GmbH"]
repository = "https://github.com/sebastian-software/ferroni"
homepage = "https://ferroni.dev/"
documentation = "https://docs.rs/ferroni"
keywords = ["regex", "oniguruma", "textmate", "syntax-highlighting", "ferramenta"]
categories = ["text-processing", "parsing", "text-editors"]
rust-version = "1.94"
autobenches = false
exclude = [".cache/", ".cargo/", "benches/", "docs/", "fuzz/", "scripts/", "examples/backtrack_rewrite_census.rs", "examples/prefilter_census.rs", "examples/profile_cpp_scanner.rs", "examples/profile_scanner_patterns.rs"]

[package.metadata.docs.rs]
# The `ffi` feature links a local Oniguruma C checkout that docs.rs cannot
# provide, so document the pure-Rust features explicitly.
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

# These mirror the crate-level attributes that used to live in `src/lib.rs`, so
# the same policy applies to tests, benches, and examples as well as the lib.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# The C port keeps items that upstream Oniguruma declares but does not use.
dead_code = "allow"
# Public types implement Debug; the C port is exempt until #287 decides it.
missing_debug_implementations = "warn"
# Rust API items need docs; the C-port modules opt out in src/lib.rs.
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
# ADR-001 keeps the module and control-flow structure of the C original, so the
# lints that would restructure ported code are allowed on purpose.
collapsible_if = "allow"
collapsible_match = "allow"

[features]
default = ["dfa-prefilter"]
# The scanner's multi-pattern DFA pre-filter (ADR-008), which decides before
# any attempt which patterns of a set can match where. It brings the
# regex-automata and regex-syntax dependencies (ADR-009); without the feature
# the scanner runs the position-lead search alone, with the same results.
dfa-prefilter = ["dep:regex-automata", "dep:regex-syntax"]
# Validation of the pre-filter (ADR-008): every search it decides also runs
# the position-lead search on the same set and panics unless both find the
# same match, captures included. For the fuzz targets and the differential
# tests; it doubles the cost of every scanner search.
prefilter-self-check = ["dfa-prefilter"]
# Benchmark-comparison harness: links a local upstream Oniguruma checkout
# (scripts/prepare-oniguruma-sources.sh or FERRONI_ONIGURUMA_DIR) for the
# in-repo C-vs-Rust benches. Not needed to use the library.
ffi = ["cc"]
# Adds Ruby's Onigmo to the comparison benchmarks
# (scripts/prepare-onigmo-sources.sh or FERRONI_ONIGMO_DIR).
onigmo = ["ffi"]

[dependencies]
aho-corasick = "1"
bitflags = "2"
memchr = "2"
smallvec = "1"
# The scanner's DFA pre-filter (feature `dfa-prefilter`, ADR-009): the regex
# crate's automata, without its public API. The seeks are byte-based and
# use ASCII look-arounds only, so no Unicode tables are needed.
# perf-literal and perf-inline give the meta regex the literal prefilters and inlining the benches got through dev-dependency unification.
regex-automata = { version = "0.4", optional = true, default-features = false, features = ["std", "syntax", "meta", "nfa-thompson", "hybrid", "perf-literal", "perf-inline"] }
regex-syntax = { version = "0.8", optional = true, default-features = false, features = ["std"] }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
fancy-regex = "0.19"
libc = "0.2"
pcre2-sys = "0.2"
regex = "1"
serde_json = "1"

[profile.release]
lto = "thin"

[profile.bench]
lto = "thin"

[[bench]]
name = "battle_bench"
harness = false
required-features = ["ffi"]

[[bench]]
name = "regression_bench"
harness = false

[[bench]]
name = "battle_mem_rust"
harness = false

[[bench]]
name = "battle_mem_onig"
harness = false
required-features = ["ffi"]

[[bench]]
name = "backtrack_compiler_bench"
harness = false

[[bench]]
name = "purescript_rewrite_bench"
harness = false

[[bench]]
name = "cpp_scanner_bench"
harness = false

[[bench]]
name = "scss_scanner_bench"
harness = false

[[bench]]
name = "scanner_compile_bench"
harness = false

[[bench]]
name = "java_scanner_bench"
harness = false

[[bench]]
name = "shiki_scanner_bench"
harness = false

[[bench]]
name = "ferriki_scanner_bench"
harness = false
