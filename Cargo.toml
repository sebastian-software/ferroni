[package]
name = "ferroni"
version = "1.3.3"
edition = "2024"
description = "Pure-Rust Oniguruma-compatible regex engine — same feature class, no C toolchain."
license = "BSD-2-Clause"
authors = ["Sebastian Software GmbH"]
repository = "https://github.com/sebastian-software/ferroni"
homepage = "https://sebastian-software.github.io/ferroni/"
documentation = "https://docs.rs/ferroni"
readme = "README.md"
keywords = ["regex", "oniguruma", "unicode", "simd", "ferramenta"]
categories = ["text-processing", "parsing"]
rust-version = "1.94"
autobenches = false
exclude = [".cache/", "benches/", "docs/", "fuzz/", "scripts/"]

[package.metadata.docs.rs]
# The `ffi` feature links a local Oniguruma C checkout that docs.rs cannot
# provide, so the documentation build stays on the default feature set.
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

# These mirror the crate-level attributes that used to live in `src/lib.rs`, so
# the same policy applies to tests, benches, and examples as well as the lib.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# The C port keeps items that upstream Oniguruma declares but does not use.
dead_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
# ADR-001 keeps the module and control-flow structure of the C original, so the
# lints that would restructure ported code are allowed on purpose.
collapsible_if = "allow"
collapsible_match = "allow"

[features]
# Benchmark-comparison harness: links a local upstream Oniguruma checkout
# (scripts/prepare-oniguruma-sources.sh or FERRONI_ONIGURUMA_DIR) for the
# in-repo C-vs-Rust benches. Not needed to use the library.
ffi = ["cc"]

[dependencies]
aho-corasick = "1"
bitflags = "2"
memchr = "2"
smallvec = "1"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
criterion-codspeed = { version = "5", package = "codspeed-criterion-compat" }
libc = "0.2"
regex = "1"
serde_json = "1"

[profile.release]
lto = "thin"

[profile.bench]
lto = "thin"

[[bench]]
name = "battle_bench"
harness = false
required-features = ["ffi"]

[[bench]]
name = "codspeed_bench"
harness = false

[[bench]]
name = "battle_mem_rust"
harness = false

[[bench]]
name = "battle_mem_onig"
harness = false
required-features = ["ffi"]
