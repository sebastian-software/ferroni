[package]
name = "ferroni"
version = "1.2.8"
edition = "2021"
description = "Pure-Rust Oniguruma regex engine with SIMD-accelerated search"
license = "BSD-2-Clause"
authors = ["Sebastian Software GmbH"]
repository = "https://github.com/sebastian-software/ferroni"
homepage = "https://github.com/sebastian-software/ferroni"
readme = "README.md"
keywords = ["regex", "oniguruma", "unicode", "pattern-matching", "simd"]
categories = ["text-processing", "parsing"]
rust-version = "1.81"
exclude = [".cache/", "benches/", "docs/", "scripts/"]

[features]
ffi = ["cc"]

[dependencies]
aho-corasick = "1"
bitflags = "2"
memchr = "2"
smallvec = "1"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
criterion-codspeed = { version = "4.3.0", package = "codspeed-criterion-compat" }
libc = "0.2"
regex = "1"
serde_json = "1"

[profile.release]
lto = "thin"

[profile.bench]
lto = "thin"

[[bench]]
name = "battle_bench"
harness = false
required-features = ["ffi"]

[[bench]]
name = "codspeed_bench"
harness = false

[[bench]]
name = "battle_mem_rust"
harness = false

[[bench]]
name = "battle_mem_onig"
harness = false
required-features = ["ffi"]
