[package]
name = "ferroni"
version = "1.9.2"
edition = "2024"
description = "Oniguruma's regex engine in pure Rust: full Oniguruma syntax, a vscode-oniguruma-compatible TextMate scanner, no C toolchain"
license = "BSD-2-Clause"
authors = ["Sebastian Software GmbH"]
repository = "https://github.com/sebastian-software/ferroni"
homepage = "https://ferroni.dev/"
documentation = "https://docs.rs/ferroni"
readme = "README.md"
keywords = ["regex", "oniguruma", "textmate", "syntax-highlighting", "ferramenta"]
categories = ["text-processing", "parsing", "text-editors"]
rust-version = "1.94"
autobenches = false
exclude = [".cache/", "benches/", "docs/", "fuzz/", "scripts/", "examples/profile_cpp_scanner.rs", "examples/profile_scanner_patterns.rs"]

[package.metadata.docs.rs]
# The `ffi` feature links a local Oniguruma C checkout that docs.rs cannot
# provide, so document the pure-Rust features explicitly.
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

# These mirror the crate-level attributes that used to live in `src/lib.rs`, so
# the same policy applies to tests, benches, and examples as well as the lib.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# The C port keeps items that upstream Oniguruma declares but does not use.
dead_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
# ADR-001 keeps the module and control-flow structure of the C original, so the
# lints that would restructure ported code are allowed on purpose.
collapsible_if = "allow"
collapsible_match = "allow"

[features]
# Benchmark-comparison harness: links a local upstream Oniguruma checkout
# (scripts/prepare-oniguruma-sources.sh or FERRONI_ONIGURUMA_DIR) for the
# in-repo C-vs-Rust benches. Not needed to use the library.
ffi = ["cc"]
# Adds Ruby's Onigmo to the comparison benchmarks
# (scripts/prepare-onigmo-sources.sh or FERRONI_ONIGMO_DIR).
onigmo = ["ffi"]

[dependencies]
aho-corasick = "1"
bitflags = "2"
memchr = "2"
smallvec = "1"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
fancy-regex = "0.19"
libc = "0.2"
pcre2-sys = "0.2"
regex = "1"
serde_json = "1"

[profile.release]
lto = "thin"

[profile.bench]
lto = "thin"

[[bench]]
name = "battle_bench"
harness = false
required-features = ["ffi"]

[[bench]]
name = "regression_bench"
harness = false

[[bench]]
name = "battle_mem_rust"
harness = false

[[bench]]
name = "battle_mem_onig"
harness = false
required-features = ["ffi"]

[[bench]]
name = "backtrack_compiler_bench"
harness = false

[[bench]]
name = "purescript_rewrite_bench"
harness = false

[[bench]]
name = "cpp_scanner_bench"
harness = false

[[bench]]
name = "scss_scanner_bench"
harness = false

[[bench]]
name = "scanner_compile_bench"
harness = false

[[bench]]
name = "java_scanner_bench"
harness = false

[[bench]]
name = "shiki_scanner_bench"
harness = false
