[package]
name = "ferroni-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.94"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Every scanner search the DFA pre-filter decides also runs the position-lead
# search and panics on a different decision (ADR-008), so the two scanner
# targets check the pre-filter on every search they make.
[dependencies.ferroni]
path = ".."
features = ["prefilter-self-check"]

[[bin]]
name = "pattern-compile"
path = "fuzz_targets/pattern_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern-match"
path = "fuzz_targets/pattern_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scanner-api"
path = "fuzz_targets/scanner_api.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prefilter-differential"
path = "fuzz_targets/prefilter_differential.rs"
test = false
doc = false
bench = false

# Keep this harness out of the published crate and its dependency graph.
[workspace]
members = ["."]
