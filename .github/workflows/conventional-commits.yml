name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Validate pull request title
    runs-on: ubuntu-latest
    steps:
      # release-please derives the changelog from the squashed commit, which is
      # the pull request title, so the title has to be a Conventional Commit.
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
