name: Portable Eager prototype

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Portable Eager (${{ matrix.os }}, MSRV)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check portable groups against the ordinary scanner
        run: cargo test --locked --features portable-eager-prototype,prefilter-self-check --lib --test scanner_group_prototype --test precompiled_scanner --test compat_prefilter_differential --test scanner_prefilter_regressions
