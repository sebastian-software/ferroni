name: Prepared Eager archives

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    name: Prepared Eager (${{ matrix.os }}, MSRV)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check portable groups against the ordinary scanner
        run: cargo test --locked --features precompiled-eager,prefilter-self-check --lib --test scanner_group_prototype --test precompiled_eager --test precompiled_scanner --test compat_prefilter_differential --test scanner_prefilter_regressions
      - name: Public API and guide examples
        run: cargo test --locked --features precompiled-eager --doc
      - name: Legacy feature alias
        run: cargo test --locked --features portable-eager-prototype --test precompiled_eager
