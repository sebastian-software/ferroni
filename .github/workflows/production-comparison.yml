name: Source-backed regex comparison

# Manual only: provider-managed runners cost money. Platforms retain separate
# reports; there is no cross-host aggregate or automatic performance claim.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner profile
        type: choice
        options: [both, macos-arm64, linux-x86-64]
        default: both
      cases:
        description: Comma-separated case IDs (empty means complete corpus)
        type: string
        default: ""
      measure_seconds:
        description: Criterion seconds per case, engine and lane
        type: choice
        options: ["3", "5"]
        default: "3"

permissions:
  contents: read

concurrency:
  group: production-comparison-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  RUSTUP_TOOLCHAIN: stable

jobs:
  compare:
    if: github.repository == 'sebastian-software/ferroni'
    name: ${{ matrix.profile }}
    runs-on: ${{ matrix.profile == 'macos-arm64' && 'blacksmith-6vcpu-macos-26' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.platform == 'macos-arm64' && '["macos-arm64"]' || inputs.platform == 'linux-x86-64' && '["linux-x86-64"]' || '["macos-arm64","linux-x86-64"]') }}
    env:
      CASES: ${{ inputs.cases }}
      MEASURE_SECONDS: ${{ inputs.measure_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: production-regex-${{ matrix.profile }}
      - name: Prepare native C inputs
        run: |
          ./scripts/prepare-oniguruma-sources.sh
          ./scripts/prepare-onigmo-sources.sh
      - name: Check corpus and reporting rules
        run: |
          python3 scripts/check-production-corpus.py
          python3 -m unittest discover -s scripts/tests -p 'test_production*.py'
      - name: Validate and measure in independent processes
        run: |
          arguments=()
          if [[ -n "$CASES" ]]; then arguments+=(--cases "$CASES"); fi
          python3 scripts/compare-production.py run "$RUNNER_TEMP/production" \
            --measure-seconds "$MEASURE_SECONDS" --timeout 120 \
            --host-note "Dedicated Blacksmith VM; host power/thermal state unavailable. Workflow $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT." \
            "${arguments[@]}"
      - name: Retain complete evidence, including unsuccessful calls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production/
          retention-days: 30
