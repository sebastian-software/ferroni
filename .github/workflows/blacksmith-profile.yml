name: Blacksmith profile

# Where Ferroni spends its time, next to C Oniguruma and the regex crate, on
# one Apple Silicon and one x86-64 host. scripts/cloud-profile.py times each
# case with Criterion and samples Ferroni and C with samply; the case sets
# split patterns any regex engine runs ("trivial") from syntax and TextMate
# scanner work that needs Oniguruma ("oniguruma"), including replays of real
# Shiki scanner calls. The full set takes about an hour per host with the
# defaults. Provider-managed runners cost money, so the workflow only runs
# when dispatched by hand.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner profile
        type: choice
        options: [both, macos-arm64, linux-x86-64]
        default: both
      cases:
        description: Case set
        type: choice
        options: [all, trivial, oniguruma]
        default: all
      profile_seconds:
        description: Seconds of sampling per case and engine
        type: choice
        options: ["10", "15", "30"]
        default: "15"
      measure_seconds:
        description: Criterion measurement seconds per case and engine
        type: choice
        options: ["5", "10"]
        default: "5"

permissions:
  contents: read

concurrency:
  group: blacksmith-profile-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  # rust-toolchain.toml pins the local default; keep the requested one in charge.
  RUSTUP_TOOLCHAIN: stable

jobs:
  profile:
    name: ${{ matrix.profile }} / ${{ inputs.cases }}
    if: github.repository == 'sebastian-software/ferroni'
    runs-on: ${{ matrix.profile == 'macos-arm64' && 'blacksmith-6vcpu-macos-26' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.platform == 'macos-arm64' && '["macos-arm64"]' || inputs.platform == 'linux-x86-64' && '["linux-x86-64"]' || '["macos-arm64","linux-x86-64"]') }}
    env:
      PROFILE: ${{ matrix.profile }}
      RUNNER_LABEL: ${{ matrix.profile == 'macos-arm64' && 'blacksmith-6vcpu-macos-26' || 'blacksmith-4vcpu-ubuntu-2404' }}
      CASES: ${{ inputs.cases }}
      PROFILE_SECONDS: ${{ inputs.profile_seconds }}
      MEASURE_SECONDS: ${{ inputs.measure_seconds }}
      PROFILE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install samply
        run: cargo install samply --version 0.13.1 --locked
      - name: Allow unprivileged perf events
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0
      - name: Prepare Oniguruma sources
        run: ./scripts/prepare-oniguruma-sources.sh
      - name: Measure and profile
        run: >-
          ./scripts/cloud-profile.py "$RUNNER_TEMP/profile"
          --runner-profile "$PROFILE" --cases "$CASES"
          --profile-seconds "$PROFILE_SECONDS" --measure-seconds "$MEASURE_SECONDS"
      - name: Summarize
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/profile/summary.md" ]]; then
            cat "$RUNNER_TEMP/profile/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### $PROFILE: no summary, see the job log and the logs artifact" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-${{ matrix.profile }}-${{ inputs.cases }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/profile/*.json
            ${{ runner.temp }}/profile/summary.md
            ${{ runner.temp }}/profile/profiles/
            ${{ runner.temp }}/profile/logs/
          if-no-files-found: warn
          retention-days: 30
