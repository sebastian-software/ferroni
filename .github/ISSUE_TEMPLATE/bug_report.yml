name: Bug report
description: Report a reproducible defect.
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the unexpected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, operating system, and the toolchain or runtime version you used.
      placeholder: |
        version 1.2.3
        Linux 6.12
        Node 24
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest command, input, or code sample that reproduces the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error output or log where you have one.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Triage checklist
      options:
        - label: I searched the existing issues for duplicates.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
